# Monokai Pro Light theme for Helix
# Based on monokai_pro.toml by WindSoilder, adapted for light mode
# Accent colors derived from the official Monokai Pro Light palette: https://monokai.pro
#
# This file was generated by claude.

"ui.text.focus" = { fg = "yellow", modifiers = ["bold"] }
"ui.text.inactive" = { fg = "base4" }
"ui.text.directory" = { fg = "blue" }
"ui.text.symlink" = { fg = "blue", modifiers = ["italic"] }
"ui.menu" = { fg = "base8", bg = "base2" }
"ui.menu.selected" = { fg = "base0", bg = "purple" }
"ui.menu.scroll" = { fg = "base4", bg = "base2" }
"ui.virtual.whitespace" = "base4"
"ui.virtual.ruler" = { bg = "base1" }
"ui.virtual.jump-label" = { fg = "red", modifiers = ["bold"] }
"ui.virtual.indent-guide" = { fg = "base3" }
"ui.virtual.wrap" = { fg = "base4" }

"info" = "base5"
"hint" = "base5"

# Background color. Helix also emits this bg as OSC 11 so the terminal repaints
# to match the theme; fg must be set too, otherwise any cell the theme doesn't
# style falls through to the terminal's own foreground (near-black here).
"ui.background" = { fg = "base8", bg = "base0" }
"ui.background.separator" = { fg = "base3" }

# status bars, panels, modals, autocompletion
"ui.statusline" = { fg = "base8", bg = "base3" }
"ui.statusline.inactive" = { fg = "base5", bg = "base1" }
"ui.statusline.normal" = { fg = "base0", bg = "blue" }
"ui.statusline.insert" = { fg = "base0", bg = "green" }
"ui.statusline.select" = { fg = "base0", bg = "purple" }
"ui.statusline.separator" = { fg = "base4", bg = "base3" }
"ui.popup" = { fg = "base8", bg = "base2" }
"ui.popup.info" = { fg = "base8", bg = "base2" }
"ui.help" = { fg = "base8", bg = "base2" }

# Split borders. fg styles the │ glyph; only bg was set before, so the glyph
# itself was drawn in the terminal's default foreground — a near-black line.
"ui.window" = { fg = "base3" }

# pickers
"ui.picker.header" = { fg = "base5" }
"ui.picker.header.column" = { fg = "base5", modifiers = ["underlined"] }
"ui.picker.header.column.active" = { fg = "base8", modifiers = ["bold", "underlined"] }

# active line, highlighting
"ui.selection" = { bg = "base3" }
"ui.selection.primary" = { bg = "base3" }
"ui.cursor.match" = { bg = "base3" }
"ui.cursorline" = { bg = "base1" }
"ui.cursorcolumn" = { bg = "base1" }
"ui.highlight" = { bg = "base2" }
"ui.highlight.frameline" = { bg = "base3" }
"tabstop" = { bg = "base2" }

# Gutter. ui.linenr.selected and ui.gutter.selected both need cursorline's bg or
# the current line reads as two mismatched bands.
"ui.gutter" = { bg = "base0" }
"ui.gutter.selected" = { bg = "base1" }
"ui.gutter.virtual" = { fg = "base3", bg = "base0" }
"ui.gutter.selected.virtual" = { fg = "base3", bg = "base1" }
"ui.linenr" = { fg = "base4" }
"ui.linenr.selected" = { fg = "base6", bg = "base1" }
"ui.debug.breakpoint" = { fg = "red" }
"ui.debug.active" = { fg = "orange" }

# bufferline, inlay hints
"ui.bufferline" = { fg = "base5", bg = "base1" }
"ui.bufferline.active" = { fg = "base8", bg = "base0" }
"ui.bufferline.background" = { bg = "base1" }
"ui.virtual.inlay-hint" = { fg = "base4" }

# comments
"comment" = { fg = "base4", modifiers = ["italic"] }
"comment.unused" = { fg = "base4", modifiers = ["italic", "dim"] }

# cursor, variables, constants, attributes, fields
"ui.cursor" = { fg = "base0", bg = "base5" }
"ui.cursor.primary" = { fg = "base0", bg = "base8" }
"attribute" = "blue"
"variable" = "base8"
"constant" = "orange"
"variable.builtin" = "red"
"constant.builtin" = "red"
"namespace" = "base8"

# base text, punctuation
"ui.text" = { fg = "base8" }
"punctuation" = "base6"

# classes, types, primitives
"type" = "green"
"type.builtin" = { fg = "red" }
"label" = "base8"

# declaration, methods, routines
"constructor" = "blue"
"function" = "green"
"function.macro" = { fg = "blue" }
"function.builtin" = { fg = "blue" }

# operator, tags, units, punctuations
"operator" = "red"
"tag" = "red"
"variable.other.member" = "base8"

# keywords, special
"keyword" = { fg = "red" }
"keyword.directive" = "blue"
"variable.parameter" = "#e16032"

# error
"error" = "red"

# annotations, decorators
"special" = "#e16032"
"module" = "#e16032"

# warnings, escape characters, regex
"warning" = "orange"
"constant.character" = "yellow"
"constant.character.escape" = { fg = "base8" }

# strings
"string" = "yellow"

# integer, floating point
"constant.numeric" = "purple"

# vcs
"diff.plus" = "green"
"diff.delta" = "orange"
"diff.minus" = "red"

# make diagnostic underlined, to distinguish with selection text.
"diagnostic.warning" = { underline = { color = "orange", style = "curl" } }
"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.info" = { underline = { color = "base5", style = "curl" } }
"diagnostic.hint" = { underline = { color = "base5", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

# markup highlight
"markup.heading" = "green"
"markup.bold" = { fg = "orange", modifiers = ["bold"] }
"markup.italic" = { fg = "orange", modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "orange", modifiers = ["underlined"] }
"markup.link.label" = "purple"
"markup.link.text" = "yellow"
"markup.quote" = "green"

# rainbow-brackets (opt-in via editor.rainbow-brackets); without this key Helix
# falls back to raw ANSI red/yellow/green/blue/cyan/magenta.
rainbow = ["red", "orange", "yellow", "green", "blue", "purple"]

[palette]
# primary accent colors (from official Monokai Pro Light palette)
"red" = "#e14775"
"orange" = "#e16032"
"yellow" = "#cc7a0a"
"green" = "#269d69"
"blue" = "#1c8ca8"
"purple" = "#7058be"
# base colors, from lightest (background) to darkest (foreground)
"base0" = "#faf4f2"
"base1" = "#f0eaeb"
"base2" = "#e8e3e4"
"base3" = "#bfb9ba"
"base4" = "#a59fa0"
"base5" = "#706b6e"
"base6" = "#5e585f"
"base7" = "#403c41"
"base8" = "#29242a"
