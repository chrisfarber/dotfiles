# Monokai Pro Light theme for Helix
#
# Ported from the official theme: monokai.theme-monokai-pro-vscode, themes/
# "Monokai Pro Light.json". Every colour below appears verbatim in that file;
# scope assignments follow its tokenColors and editor colors.
#
# This file was generated by claude.

# background color. Helix also emits this bg as OSC 11 so the terminal repaints
# to match the theme; fg must be set too, otherwise any cell the theme doesn't
# style falls through to the terminal's own foreground (near-black here).
"ui.background" = { fg = "base8", bg = "base0" }
"ui.background.separator" = { fg = "base2" }

# Split borders. fg styles the │ glyph; with only a bg set it renders in the
# terminal's default foreground, which is near-black in Monokai Pro Light.
"ui.window" = { fg = "base4" }

# Popups, menus and help are borderless in Helix — nothing draws an outline, so
# they can only read as raised via background contrast. The official theme puts
# widgets *lighter* than the editor (#fefaf9 on #faf4f2) and separates them with
# a 1px border; that inverts to invisible here, so they sit on base1 instead.
"ui.popup" = { fg = "base8", bg = "base1" }
"ui.popup.info" = { fg = "base8", bg = "base1" }
"ui.help" = { fg = "base8", bg = "base1" }
"ui.menu" = { fg = "base7", bg = "base1" }
"ui.menu.selected" = { fg = "red", bg = "base2" }
"ui.menu.scroll" = { fg = "base5", bg = "base2" }

# Selected rows are red rather than inverted, matching list.activeSelectionForeground.
"ui.text" = { fg = "base8" }
"ui.text.focus" = { fg = "red", modifiers = ["bold"] }
"ui.text.inactive" = { fg = "base6" }
"ui.text.directory" = { fg = "blue" }
"ui.text.symlink" = { fg = "blue", modifiers = ["italic"] }

"ui.picker.header" = { fg = "base6" }
"ui.picker.header.column" = { fg = "base6", modifiers = ["underlined"] }
"ui.picker.header.column.active" = { fg = "base8", modifiers = ["bold", "underlined"] }

# status bar. The official statusline is deliberately quiet: base1 bar, base6 text.
"ui.statusline" = { fg = "base6", bg = "base1" }
"ui.statusline.inactive" = { fg = "base5", bg = "base1" }
"ui.statusline.normal" = { fg = "base0", bg = "blue" }
"ui.statusline.insert" = { fg = "base0", bg = "green" }
"ui.statusline.select" = { fg = "base0", bg = "purple" }
"ui.statusline.separator" = { fg = "base4", bg = "base1" }

# bufferline. Tabs sit on the editor background; the active one is red text.
"ui.bufferline.background" = { bg = "base0" }
"ui.bufferline" = { fg = "base6", bg = "base0" }
"ui.bufferline.active" = { fg = "red", bg = "base0", modifiers = ["bold"] }

# active line, selections
"ui.cursorline" = { bg = "base1" }
"ui.cursorcolumn" = { bg = "base1" }
"ui.selection" = { bg = "base3" }
"ui.selection.primary" = { bg = "base4" }
"ui.cursor" = { fg = "base0", bg = "base7" }
"ui.cursor.primary" = { fg = "base0", bg = "base8" }
"ui.cursor.match" = { bg = "base4" }
"ui.highlight" = { bg = "base2" }
"ui.highlight.frameline" = { bg = "base3" }
"tabstop" = { bg = "base2" }

# gutter. ui.linenr.selected and ui.gutter.selected both need cursorline's bg or
# the current line reads as two mismatched bands.
"ui.gutter" = { bg = "base0" }
"ui.gutter.selected" = { bg = "base1" }
"ui.gutter.virtual" = { fg = "base3", bg = "base0" }
"ui.gutter.selected.virtual" = { fg = "base3", bg = "base1" }
"ui.linenr" = { fg = "base4" }
"ui.linenr.selected" = { fg = "base7", bg = "base1" }
"ui.debug.breakpoint" = { fg = "red" }
"ui.debug.active" = { fg = "orange" }

# virtual text
"ui.virtual.whitespace" = "base4"
"ui.virtual.ruler" = { bg = "base1" }
"ui.virtual.indent-guide" = { fg = "base3" }
"ui.virtual.wrap" = { fg = "base4" }
"ui.virtual.inlay-hint" = { fg = "base6" }
"ui.virtual.jump-label" = { fg = "red", modifiers = ["bold"] }

# comments
"comment" = { fg = "base5", modifiers = ["italic"] }
"comment.unused" = { fg = "base5", modifiers = ["italic", "dim"] }

# Upstream paints variable.parameter orange italic ("Function arguments", a rule
# it has carried since 2006), but the Rust TextMate grammar never emits that
# scope, so VSCode shows Rust parameters as plain text. Helix's queries do tag
# them — declaration and every use — so honouring the rule makes Rust far louder
# here than in the original. Plain foreground matches what VSCode actually draws.
"variable" = "base8"
"variable.other.member" = "base8"
"variable.parameter" = "base8"
"variable.builtin" = { fg = "base7", modifiers = ["italic"] }

# every flavour of constant is purple, including escapes and enum members
"constant" = "purple"
"constant.builtin" = "purple"
"constant.numeric" = "purple"
"constant.character" = "purple"
"constant.character.escape" = "purple"
"type.enum.variant" = "purple"
"label" = "purple"

# strings
"string" = "yellow"
"string.special.symbol" = "orange"

# Punctuation recedes rather than matching the text — base6 is well below the
# foreground, which is what keeps dense code readable in this theme.
"punctuation" = "base6"
"punctuation.special" = "orange"

# Types are blue; green belongs to functions alone. type.builtin stays upright —
# Helix folds Option, Result, Fn, Box and String in here, which upstream treats as
# ordinary type names rather than the italic support.type.
"type" = "blue"
"type.builtin" = "blue"
"attribute" = { fg = "blue", modifiers = ["italic"] }
"namespace" = "blue"

# Functions. constructor is blue, not green: Rust's queries assign it to any
# PascalCase call, so it covers Ok/Err/Some and struct literals — type names in
# upstream's reading, not calls.
"constructor" = "blue"
"function" = "green"
"function.builtin" = "green"
"function.macro" = "green"

# Keywords and operators. VSCode resolves foreground and fontStyle independently,
# picking the most specific rule for each: Rust's storage.* keywords take their red
# from the language override but the italic from the generic storage.type rule. So
# `let`, `mut`, `struct` and `const` come out red italic while control flow and
# `fn` stay upright. Italicising keyword.storage reproduces that — the fallback
# then covers .type and .modifier, which is also why declarations aren't blue: the
# blue in upstream's storage.type belongs to languages Helix captures differently.
"keyword" = "red"
"keyword.operator" = "red"
"keyword.directive" = "red"
"keyword.storage" = { fg = "red", modifiers = ["italic"] }
"operator" = "red"
"tag" = "red"

# interpolation, placeholders, decorators
"special" = "orange"

# diagnostics
"error" = "red"
"warning" = "orange"
"info" = "blue"
"hint" = "purple"

# underline diagnostics so they stay distinct from selected text
"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.warning" = { underline = { color = "orange", style = "curl" } }
"diagnostic.info" = { underline = { color = "blue", style = "curl" } }
"diagnostic.hint" = { underline = { color = "purple", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

# markup. Bold, italic and quotes carry no colour of their own upstream.
"markup.heading" = "yellow"
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.quote" = { modifiers = ["italic"] }
"markup.raw" = "orange"
"markup.link.url" = { fg = "green", modifiers = ["underlined"] }
"markup.link.label" = "blue"
"markup.link.text" = "red"

# vcs
"diff.plus" = "green"
"diff.delta" = "orange"
"diff.minus" = "red"

# rainbow-brackets (opt-in via editor.rainbow-brackets); these are
# editorBracketHighlight.foreground1-6. Without this key Helix falls back to raw
# ANSI red/yellow/green/blue/cyan/magenta.
rainbow = ["red", "orange", "yellow", "green", "blue", "purple"]

[palette]
# accent colors
"red" = "#e14775"
"orange" = "#e16032"
"yellow" = "#cc7a0a"
"green" = "#269d69"
"blue" = "#1c8ca8"
"purple" = "#7058be"
# Base ramp, lightest (background) to darkest (foreground). The role listed for
# each is the official editor colour it was taken from.
"base0" = "#faf4f2" # editor background
"base1" = "#ede7e5" # statusline, cursorline, widget backgrounds
"base2" = "#e0dad9" # widget and panel borders
"base3" = "#d3cdcc" # indent guides, selection
"base4" = "#bfb9ba" # line numbers, whitespace, rulers
"base5" = "#a59fa0" # comments
"base6" = "#918c8e" # punctuation, statusline text
"base7" = "#706b6e" # active line number, self/this
"base8" = "#29242a" # foreground
